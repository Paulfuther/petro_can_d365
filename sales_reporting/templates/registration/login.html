<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >
    <title>Petro-Can D365 Login</title>

    <style>
        body {
            margin: 0;
            background: #f4f6f8;
            color: #202124;
            font-family: Arial, sans-serif;
        }

        .container {
            max-width: 420px;
            margin: 80px auto;
            padding: 0 20px;
        }

        .card {
            padding: 32px;
            background: white;
            border: 1px solid #dfe3e8;
            border-radius: 10px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.05);
        }

        h1 {
            margin-top: 0;
        }

        label {
            display: block;
            margin: 16px 0 6px;
            font-weight: bold;
        }

        input {
            box-sizing: border-box;
            width: 100%;
            padding: 11px;
            border: 1px solid #c7cdd4;
            border-radius: 6px;
        }

        button {
            width: 100%;
            margin-top: 22px;
            padding: 12px;
            border: 0;
            border-radius: 6px;
            background: #1a73e8;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .errorlist {
            color: #b3261e;
        }
    </style>
</head>

<body>
    <main class="container">
        <section class="card">
            <h1>Petro-Can D365</h1>
            <p>Sign in to continue.</p>

            {% if form.errors %}
                <p class="errorlist">
                    The username or password was incorrect.
                </p>
            {% endif %}

            <form method="post">
                {% csrf_token %}

                {{ form.username.label_tag }}
                {{ form.username }}

                {{ form.password.label_tag }}
                {{ form.password }}

                {% if next %}
                    <input
                        type="hidden"
                        name="next"
                        value="{{ next }}"
                    >
                {% endif %}

                <button type="submit">Sign in</button>
            </form>
        </section>
    </main>
</body>
</html>
